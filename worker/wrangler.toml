name = "3dscanpost-quote"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Runs on the same domain as the static site, so the form posts to /api/quote with no CORS.
routes = [{ pattern = "3dscanpost.com/api/quote*", zone_name = "3dscanpost.com" }]

[vars]
PUBLIC_BASE = "https://3dscanpost.com"
NOTIFY_FROM = "3DScanPost Quotes <quotes@send.3dscanpost.com>"   # Resend sending domain (see SETUP.md)
NOTIFY_TO = "contact@3dscanpost.com"                              # where new quote requests are emailed
CONFIRM_FROM = "3DScanPost <noreply@send.3dscanpost.com>"         # confirmation to the customer
REPLY_TO = "contact@3dscanpost.com"
TURNSTILE_CHECK_HOSTNAME = "true"           # set "false" only in .dev.vars for local testing

# Private bucket for photos and a JSON copy of each submission.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "3dscanpost-quote-photos"

# Basic per-IP rate limit: 4 submissions per 60 seconds per IP, per Cloudflare location.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "3001"
simple = { limit = 4, period = 60 }

# Secrets (set with `wrangler secret put`, never in this file):
#   TURNSTILE_SECRET   Turnstile widget secret key
#   RESEND_API_KEY     Resend API key (sending access only), used for both emails
#   LINK_SECRET        long random string used to sign photo links
